<head>

<body>
    <nav>

        <a href="../contact/" aria-current="page">Contact</a>

    </nav>
    <h1>Contact</h1>
    <p>Use this form to open a message to me in your email app.</p>
<form action="mailto:jtw010@ucsd.edu" method="POST" enctype="text/plain">
    <p>
        <label>Email
            <input name="email" type="email" value="visitor@example.com" required>
        </label>
    </p>
    <p>
        <label>Subject
            <input name="subject" value="Hello from your portfolio" required>
        </label>
    </p>
    <p>
        <label>Message
            <textarea name="body" rows="5" required>Hello John, I enjoyed visiting your portfolio!</textarea>
        </label>
    </p>
    <button type="submit">Send message</button>
</form>

</body>
</html>
